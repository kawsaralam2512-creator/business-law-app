<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Law Study App</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#0f766e">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="/" class="logo">
                <i class="fa-solid fa-book-open"></i> Law Study
            </a>
        </div>

        <form action="/search" method="GET" class="search-form">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" name="q" placeholder="Search topics, cases..." value="{{ request.args.get('q', '') }}" autocomplete="off">
        </form>

        <!-- Navigation Controls (Back, Forward, Home) -->
        <div class="nav-controls">
            <button onclick="history.back()" title="Go Back" class="nav-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <button onclick="history.forward()" title="Go Forward" class="nav-btn"><i class="fa-solid fa-arrow-right"></i></button>
            <a href="/" title="Home" class="nav-btn"><i class="fa-solid fa-house"></i></a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Floating Scroll Buttons -->
    <div class="floating-nav">
        <button onclick="scrollToTop()" class="float-btn" title="Scroll Up"><i class="fa-solid fa-arrow-up"></i></button>
        <button onclick="scrollToBottom()" class="float-btn" title="Scroll Down"><i class="fa-solid fa-arrow-down"></i></button>
    </div>

    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
        
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function scrollToBottom() { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
    </script>
</body>
</html>
